<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Default profile cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.55">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deep" cx="0.12" cy="0.9" r="0.7">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>
  <rect width="1600" height="400" fill="url(#deep)"/>
  <rect width="1600" height="400" fill="url(#glow)"/>

  <!-- Orbit rings (HROrbit motif) -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.30">
    <circle cx="1260" cy="120" r="150" stroke-width="2"/>
    <circle cx="1260" cy="120" r="230" stroke-width="1.5" stroke-dasharray="10 14"/>
    <circle cx="1260" cy="120" r="320" stroke-width="1" stroke-opacity="0.09"/>
  </g>
  <circle cx="1408" cy="80" r="10" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="1042" cy="252" r="6" fill="#ffffff" fill-opacity="0.95"/>
  <circle cx="1512" cy="300" r="5" fill="#ffffff" fill-opacity="0.7"/>

  <!-- Soft diagonal sheen -->
  <g transform="rotate(-18 800 200)">
    <rect x="240" y="-120" width="360" height="640" fill="url(#sheen)"/>
    <rect x="700" y="-120" width="180" height="640" fill="url(#sheen)" opacity="0.6"/>
  </g>

  <!-- Subtle grid dots (left side, behind name/avatar) -->
  <g fill="#ffffff" fill-opacity="0.35">
    <g id="row">
      <circle cx="80" cy="80" r="3"/><circle cx="140" cy="80" r="3"/><circle cx="200" cy="80" r="3"/><circle cx="260" cy="80" r="3"/><circle cx="320" cy="80" r="3"/><circle cx="380" cy="80" r="3"/><circle cx="440" cy="80" r="3"/><circle cx="500" cy="80" r="3"/>
    </g>
    <use href="#row" y="60"/>
    <use href="#row" y="120" fill-opacity="0.24"/>
    <use href="#row" y="180" fill-opacity="0.16"/>
    <use href="#row" y="240" fill-opacity="0.10"/>
  </g>

  <!-- Floating accent shapes -->
  <rect x="600" y="292" width="46" height="46" rx="12" fill="#ffffff" fill-opacity="0.30" transform="rotate(18 623 315)"/>
  <rect x="880" y="60" width="34" height="34" rx="10" fill="#ffffff" fill-opacity="0.45" transform="rotate(-14 897 77)"/>
  <path d="M0 400 L1600 320 L1600 400 Z" fill="#1d4ed8" fill-opacity="0.10"/>
</svg>
